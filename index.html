html,body{margin:0}
body{font-family:"Hind Siliguri",system-ui,sans-serif;background-color:var(--bg);background-image:linear-gradient(rgba(var(--rgb),var(--ta)),rgba(var(--rgb),var(--ta)));color:var(--ink);line-height:1.5;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--brand-d) 0%,var(--brand) 62%,var(--brand-l) 130%);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 48px) 16px 84px;border-radius:0 0 30px 30px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}
.hero::before{width:220px;height:220px;right:-70px;top:-90px}
.hero::after{width:120px;height:120px;right:70px;bottom:-60px}
.hero .in{position:relative;z-index:1;max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hb{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:58px;height:58px;background:var(--logo) center/contain no-repeat}
h1{font-size:1.3rem;margin:0;font-weight:700;line-height:1.2}
.sub{margin:2px 0 0;opacity:.88;font-size:.85rem}
.iconbtn{flex:none;width:44px;height:44px;border-radius:13px;border:0;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;cursor:pointer}
.wrap{position:relative;z-index:2;max-width:640px;margin:-52px auto 0;padding:0 16px}
input,select,button,textarea{font:inherit;color:inherit}
input,select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
input:focus,select:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px rgba(var(--rgb),0.22)}
button:focus-visible,a:focus-visible{outline:3px solid rgba(var(--rgb),0.5);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--grad);color:#fff}
.btn.alt{background:transparent;color:var(--link);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:#E5484D;border:1.5px solid var(--line)}
.login{background:var(--surface);border-radius:20px;padding:22px;border:1px solid var(--line);box-shadow:var(--sh)}
.login label{display:block;font-weight:600;margin-bottom:6px}
.login .btn{width:100%;margin-top:12px;padding:14px}
.hint{color:var(--mute);margin:0 0 16px}
.err{color:#E5484D;min-height:1.4em;margin:8px 0 0}
.bar{margin-bottom:10px}
.bar input{box-shadow:var(--sh);border-color:transparent;padding:15px 16px;border-radius:16px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.filters select{box-shadow:var(--sh);border-color:transparent}
.meta{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 12px;color:var(--mute);font-size:.95rem}
.meta #count{font-weight:600;color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.top{display:flex;gap:12px;align-items:center}
.av{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.25rem;color:#fff;object-fit:cover;box-shadow:0 0 0 3px rgba(var(--rgb),0.18)}
.card h3{margin:0;font-size:1.08rem;line-height:1.3}
.brash{font-weight:600;color:var(--link);font-size:.92rem}
.role{display:inline-block;margin-top:3px;padding:1px 10px;border-radius:99px;background:rgba(var(--rgb),0.14);color:var(--link);font-weight:600;font-size:.88rem}
.unit{color:var(--mute);font-size:.92rem;margin-top:2px}
.phone{font-weight:600;font-size:1.05rem;margin:12px 0;letter-spacing:.03em}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts a{display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;padding:11px;border-radius:12px;font-weight:600}
.call{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(var(--rgb),0.3)}
.wa{background:linear-gradient(135deg,#22B35E,#0F8F55);color:#fff;box-shadow:0 4px 12px rgba(18,140,84,.3)}
.ic svg{width:13px;height:13px}
.ic{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.adm{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.small{flex:1;background:transparent;border:1.5px solid var(--line);color:var(--ink);border-radius:10px;padding:8px;font-weight:600;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
.note{background:rgba(245,179,1,.2);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:.9rem}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:20;height:54px;padding:0 20px;gap:8px;font-weight:700;border-radius:16px;border:0;background:var(--grad);color:#fff;display:flex;align-items:center;box-shadow:0 10px 24px rgba(var(--rgb),0.45);cursor:pointer}
dialog{border:0;border-radius:20px;padding:20px;width:min(92vw,420px);background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{margin:0 0 12px;font-size:1.2rem}
dialog label{display:block;font-weight:600;margin:12px 0 6px}
.row{display:flex;gap:8px;margin-top:18px}
.row .btn{flex:1}
.sw{display:flex;flex-wrap:wrap;gap:12px}
.sw button{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 0 0 1.5px var(--line)}
.sw button.on{border-color:var(--surface);box-shadow:0 0 0 3px var(--ink)}
.sw [data-t=teal]{background:linear-gradient(135deg,#0E7C86,#2DB7B0)}.sw [data-t=blue]{background:linear-gradient(135deg,#2563EB,#38BDF8)}.sw [data-t=purple]{background:linear-gradient(135deg,#7C3AED,#C084FC)}.sw [data-t=green]{background:linear-gradient(135deg,#15803D,#34D399)}.sw [data-t=rose]{background:linear-gradient(135deg,#E11D48,#FB7185)}.sw [data-t=orange]{background:linear-gradient(135deg,#C2410C,#FB923C)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:rgba(128,140,150,.16);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.pick{display:flex;align-items:center;gap:12px}
.pick label.pickbtn{margin:0;display:inline-block;cursor:pointer}
#mPrev{width:64px;height:64px}
#splash{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(160deg,var(--brand-d) 0%,var(--brand) 70%,var(--brand-l) 160%);color:#fff;transition:opacity .5s ease,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
.sp-logo{position:relative;width:170px;height:170px;border-radius:50%;background:var(--logo) center/86% no-repeat rgba(255,255,255,.16);animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.sp-logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.sp-logo::after{content:"";position:absolute;top:-12px;left:-12px;right:-12px;bottom:-12px;border-radius:50%;border:2px solid rgba(255,255,255,.45);animation:ring 1.6s ease-out infinite}
.sp-t{font-size:1.6rem;font-weight:700;animation:up .6s .25s ease both}
.sp-s{font-size:1.05rem;opacity:.9;margin-top:-10px;animation:up .6s .35s ease both}
.lgbig{width:104px;height:104px;margin:-4px auto 10px;background:var(--logo) center/contain no-repeat}
.sp-bar{width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden;animation:up .6s .4s ease both}
.sp-bar i{display:block;height:100%;width:40%;background:#fff;border-radius:4px;animation:slide 1.1s ease-in-out infinite}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(1.35);opacity:0}}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.login{margin-top:6vh;animation:up .5s .1s ease both}
.ani .card{animation:up .45s ease both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="sp-logo"></div><div class="sp-t" id="spT"></div><div class="sp-s" id="spS"></div><div class="sp-bar"><i></i></div></div>
<header class="hero"><div class="in">

  <button class="iconbtn" id="setBtn" aria-label="সেটিং"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div></header>
<div class="wrap">
  <div id="demoNote" class="note" hidden>ডেমো মোড: ডাটাবেস সংযুক্ত নেই। সদস্য কোড 1234, অ্যাডমিন কোড 0000।</div>

  <section id="login" class="login">
    <div class="lgbig"></div>
    <p class="hint">সদস্যদের ফোন নাম্বার দেখতে আপনার অ্যাক্সেস কোড দিন।</p>
    <label for="code">অ্যাক্সেস কোড</label>
    <input id="code" type="password" autocomplete="off" placeholder="কোড লিখুন">
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn" id="loginBtn">প্রবেশ করুন</button>
  </section>

  <section id="app" hidden>
    <div class="bar">
      <input id="q" type="search" placeholder="ব্রাশ নম্বর দিয়ে খুঁজুন">
    </div>
    <div class="filters">
      <select id="fDes" aria-label="পদবি"><option value="">সব পদবি</option></select>

</div>

<button class="fab" id="addBtn" hidden aria-label="নতুন সদস্য"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>নতুন সদস্য</span></button>

<dialog id="setDlg">
  <h2>সেটিং</h2>
  <label>রঙের থিম</label>
  <div class="sw" id="sw"><button data-t="teal" aria-label="টিল"></button><button data-t="blue" aria-label="নীল"></button><button data-t="purple" aria-label="বেগুনি"></button><button data-t="green" aria-label="সবুজ"></button><button data-t="rose" aria-label="গোলাপি"></button><button data-t="orange" aria-label="কমলা"></button></div>
  <label>মোড</label>
  <div class="seg" id="seg"><button data-m="auto">অটো</button><button data-m="light">লাইট</button><button data-m="dark">ডার্ক</button></div>

</dialog>

<dialog id="dlg">

<script>
/* ===== সেটিংস: এখানে নিজের Supabase তথ্য বসান ===== */
const CONFIG = {
  SUPABASE_URL: "https://syxtyqlucnusmyeilfcy.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_t0SzOMtNT-XPYeDdr9r_qA_JIqeCqTE",
  APP_TITLE: "সিরাজগঞ্জ জেলা পুলিশ",
  SUBTITLE: "সকল সদস্যদের ফোন নাম্বার"
};
/* ================================================== */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sb = (CONFIG.SUPABASE_URL && window.supabase) ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;

/* ডেমো ডাটা (শুধু ডাটাবেস ছাড়া প্রিভিউর জন্য) */
const demoSeed = () => [
  {id:"1",name:"রহিম উদ্দিন",designation:"ব্যবস্থাপক",unit:"প্রশাসন",phone:"01700000001"},
  {id:"2",name:"করিম হোসেন",designation:"হিসাবরক্ষক",unit:"হিসাব বিভাগ",phone:"01800000002"},
  {id:"3",name:"সুমি আক্তার",designation:"অফিস সহকারী",unit:"প্রশাসন",phone:"01900000003"}
];
let demoRows = demoSeed();
const bad = () => { throw new Error("কোড ভুল"); };

const api = sb ? {
  async login(code){ const {data,error}=await sb.rpc("login",{code}); if(error) throw error; return data; },
  async list(code){ const {data,error}=await sb.rpc("list_members",{code}); if(error) throw error; return data; },
  async save(code,m){ const {error}=await sb.rpc("save_member",{admin_code:code,m_id:m.id||null,m_name:m.name,m_des:m.designation,m_unit:m.unit,m_phone:m.phone,m_brash:m.brash_no||null,m_photo:m.photo||null}); if(error) throw error; },
  async del(code,id){ const {error}=await sb.rpc("delete_member",{admin_code:code,m_id:id}); if(error) throw error; }
} : {
  async login(code){ return code==="0000"?"admin":code==="1234"?"member":"none"; },
  async list(){ return [...demoRows]; },
  async save(code,m){ if(code!=="0000") bad(); if(m.id) demoRows=demoRows.map(r=>r.id===m.id?{...r,...m,photo:m.photo||r.photo}:r); else demoRows.push({...m,id:String(Date.now())}); },
  async del(code,id){ if(code!=="0000") bad(); demoRows=demoRows.filter(r=>r.id!==id); }
};

$("title").textContent = CONFIG.APP_TITLE;
$("subtitle").textContent = CONFIG.SUBTITLE;
document.title = CONFIG.APP_TITLE;
$("demoNote").hidden = !!sb;

const norm = v => String(v||"").replace(/[\u09E6-\u09EF]/g,c=>c.charCodeAt(0)-0x09E6).trim().toLowerCase();
const waNum = p => { const d=digits(p); return d.startsWith("880")?d:d.startsWith("0")?"88"+d:"880"+d; };

async function enter(c, silent){
  $("loginErr").textContent = "";
  try{
    const r = await api.login(c);
    if(r!=="member" && r!=="admin"){ if(!silent) $("loginErr").textContent="কোডটি সঠিক নয়। আবার চেষ্টা করুন।"; return; }

}

function fillFilters(){
  const opts=(key,el,label)=>{ const cur=el.value; const vals=[...new Set(rows.map(r=>r[key]).filter(Boolean))].sort();
    el.innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join(""); el.value=vals.includes(cur)?cur:""; };
  opts("designation",$("fDes"),"সব পদবি"); opts("unit",$("fUnit"),"সব বিভাগ");
}

const PH='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>';
const WA='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>';
const COLORS=["linear-gradient(135deg,#0E7C86,#2DB7B0)","linear-gradient(135deg,#2563EB,#38BDF8)","linear-gradient(135deg,#7C3AED,#C084FC)","linear-gradient(135deg,#E11D48,#FB7185)","linear-gradient(135deg,#C2410C,#FB923C)","linear-gradient(135deg,#15803D,#34D399)"];
const hash=s=>[...String(s)].reduce((a,c)=>a+c.codePointAt(0),0);
function render(){
  const q=norm($("q").value), d=$("fDes").value, u=$("fUnit").value;
  const res=rows.filter(r=>(!d||r.designation===d)&&(!u||r.unit===u)&&(!q||nb(r.brash_no).includes(nb(q))));
  $("count").textContent = `মোট ${res.length} জন`;
  $("list").innerHTML = res.length ? res.map((r,i)=>`
    <article class="card" style="animation-delay:${Math.min(i,8)*45}ms">
      <div class="top">${r.photo?`<img class="av" src="${esc(r.photo)}" alt="">`:`<div class="av" style="background:${COLORS[hash(r.name)%COLORS.length]}">${esc(Array.from(r.name||"?")[0])}</div>`}
      <div><h3>${esc(r.name)}</h3>${r.brash_no?`<div class="brash">ব্রাশ নম্বর: ${esc(r.brash_no)}</div>`:""}${r.designation?`<span class="role">${esc(r.designation)}</span>`:""}${r.unit?`<div class="unit">${esc(r.unit)}</div>`:""}</div></div>
      <div class="phone">${esc(r.phone)}</div>
      <div class="acts">
        <a class="call" href="tel:${esc(digits(r.phone))}"><span class="ic">${PH}</span>কল করুন</a>
        <a class="wa" href="https://wa.me/${waNum(r.phone)}" target="_blank" rel="noopener"><span class="ic">${WA}</span>WhatsApp</a>
      </div>
      ${role==="admin"?`<div class="adm"><button class="small" data-edit="${esc(r.id)}">সম্পাদনা</button><button class="small" data-del="${esc(r.id)}">মুছুন</button></div>`:""}
    </article>`).join("") : `<div class="empty">কাউকে পাওয়া যায়নি। খোঁজার শব্দ বা ফিল্টার বদলে দেখুন।</div>`;
}

let editId=null, newPhoto=null;
const setPrev=src=>{const i=$("mPrev"); i.hidden=!src; if(src) i.src=src;};
function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const S=240,c=document.createElement("canvas");c.width=c.height=S;const m=Math.min(img.width,img.height);c.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",0.8));};img.onerror=rej;img.src=u;});}
function openForm(r){
  editId=r?r.id:null; $("dlgTitle").textContent=r?"তথ্য সম্পাদনা":"নতুন সদস্য যোগ";
  $("mBrash").value=r?.brash_no||""; newPhoto=null; $("mPhoto").value=""; setPrev(r?.photo||""); $("mName").value=r?.name||""; $("mDes").value=r?.designation||""; $("mUnit").value=r?.unit||""; $("mPhone").value=r?.phone||"";
  $("dlg").showModal();
}
async function reload(){ rows=await api.list(code); fillFilters(); render(); }

$("loginBtn").onclick=()=>enter($("code").value.trim());
$("code").addEventListener("keydown",e=>{ if(e.key==="Enter") enter($("code").value.trim()); });
$("logoutBtn").onclick=()=>{ $("setDlg").close(); $("addBtn").hidden=true; $("logoutBtn").hidden=true; try{localStorage.removeItem("dir_code");}catch{} code="";role="none";rows=[]; $("code").value=""; $("app").hidden=true; $("login").hidden=false; };
$("q").oninput=render; $("fDes").onchange=render; $("fUnit").onchange=render;
$("addBtn").onclick=()=>openForm(null);
$("mPhoto").addEventListener("change",async e=>{const f=e.target.files[0]; if(!f) return; try{ newPhoto=await shrink(f); setPrev(newPhoto); }catch{ alert("ছবিটি পড়া যায়নি, অন্য ছবি বেছে নিন।"); }});
$("cancel").onclick=()=>$("dlg").close();
$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  try{
    await api.save(code,{id:editId,name:$("mName").value.trim(),designation:$("mDes").value.trim(),unit:$("mUnit").value.trim(),phone:$("mPhone").value.trim(),brash_no:$("mBrash").value.trim(),photo:newPhoto});
    $("dlg").close(); await reload();
  }catch{ alert("সংরক্ষণ করা যায়নি। অ্যাডমিন কোড ও ইন্টারনেট দেখুন।"); }
});
$("list").addEventListener("click",async e=>{
  const ed=e.target.closest("[data-edit]"), dl=e.target.closest("[data-del]");
  if(ed) openForm(rows.find(r=>r.id===ed.dataset.edit));
  if(dl && confirm("এই সদস্যকে মুছে ফেলবেন?")){ try{ await api.del(code,dl.dataset.del); await reload(); }catch{ alert("মোছা যায়নি।"); } }
});

/* থিম ও ডার্ক মোড */
const Hh=document.documentElement, mq=matchMedia("(prefers-color-scheme: dark)");
let TH=Hh.dataset.theme||"blue", MD="auto"; try{ MD=localStorage.getItem("dir_mode")||"auto"; }catch{}
function paintTheme(){
  Hh.dataset.theme=TH; Hh.dataset.dark=(MD==="dark"||(MD==="auto"&&mq.matches))?"1":"0";
  document.querySelectorAll("#sw button").forEach(b=>b.classList.toggle("on",b.dataset.t===TH));
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.m===MD));
  const tc=document.querySelector('meta[name=theme-color]'); if(tc) tc.content=Hh.dataset.dark==="1"?"#0D1316":getComputedStyle(Hh).getPropertyValue("--brand-d").trim();
  try{ localStorage.setItem("dir_theme",TH); localStorage.setItem("dir_mode",MD); }catch{}
}
mq.addEventListener("change",paintTheme);
$("sw").onclick=e=>{ const b=e.target.closest("button"); if(b){ TH=b.dataset.t; paintTheme(); } };
$("seg").onclick=e=>{ const b=e.target.closest("button"); if(b){ MD=b.dataset.m; paintTheme(); } };
$("setBtn").onclick=()=>$("setDlg").showModal();
$("setClose").onclick=()=>$("setDlg").close();
paintTheme();

$("spT").textContent=CONFIG.APP_TITLE; $("spS").textContent=CONFIG.SUBTITLE;
setTimeout(()=>{ $("splash").classList.add("out"); setTimeout(()=>$("splash").remove(),700); },1700);

try{ const saved=localStorage.getItem("dir_code"); if(saved) enter(saved,true); }catch{}
</script>
