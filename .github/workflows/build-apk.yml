name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          mkdir www && cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Colleague Directory" com.abir.directory --web-dir=www
          node -e "const f='capacitor.config.json',c=require('./'+f);c.server={url:'https://directory-orpin-seven.vercel.app'};require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew assembleDebug || ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: directory-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
