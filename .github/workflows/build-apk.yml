name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          mkdir www && cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "সিরাজগঞ্জ জেলা পুলিশ" com.abir.directory --web-dir=www
          node -e "const f='capacitor.config.json',c=require('./'+f);c.server={url:'https://directory-orpin-seven.vercel.app'};require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add android
      - name: App icon and splash from logo
        continue-on-error: true
        run: |
          pip install --break-system-packages pillow || true
          mkdir assets
          python3 - <<'PYEOF'
          from PIL import Image
          L = Image.open('icon.png').convert('RGBA')
          L.save('assets/icon-only.png')
          fg = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          s = int(1024 * 0.70)
          f = L.resize((s, s), Image.LANCZOS)
          fg.paste(f, ((1024 - s) // 2, (1024 - s) // 2), f)
          fg.save('assets/icon-foreground.png')
          Image.new('RGBA', (1024, 1024), (255, 255, 255, 255)).save('assets/icon-background.png')
          sp = Image.new('RGBA', (2732, 2732), (255, 255, 255, 255))
          b = L.resize((900, 900), Image.LANCZOS)
          sp.paste(b, ((2732 - 900) // 2, (2732 - 900) // 2), b)
          sp.save('assets/splash.png')
          sp.save('assets/splash-dark.png')
          PYEOF
          npx @capacitor/assets generate --android --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF' --splashBackgroundColor '#FFFFFF' --splashBackgroundColorDark '#FFFFFF'
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        id: b
        continue-on-error: true
        run: |
          cd android
          sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tee ../build.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Fallback if build failed
        if: steps.b.outcome == 'failure'
        run: |
          { echo '### আইকনসহ বিল্ড ব্যর্থ হয়েছিল, কারণ:'; echo '```'; grep -A12 'What went wrong' build.log | head -40; echo '```'; } >> $GITHUB_STEP_SUMMARY || true
          rebuild() {
            rm -rf android &&
            npx cap add android &&
            npx cap sync android &&
            (cd android &&
              sed -i 's/networkTimeout=10000/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties &&
              chmod +x gradlew &&
              ./gradlew assembleDebug)
          }
          rebuild || {
            echo 'আইকন ছাড়াও ব্যর্থ, এবার ইংরেজি নামে চেষ্টা' >> $GITHUB_STEP_SUMMARY
            node -e "const f='capacitor.config.json',c=require('./'+f);c.appName='Sirajganj Police';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
            rebuild
          }
      - uses: actions/upload-artifact@v4
        with:
          name: directory-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
